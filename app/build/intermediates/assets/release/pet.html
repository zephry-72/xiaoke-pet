    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 120px;
            height: 120px;
            overflow: hidden;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #petContainer {
            width: 100px;
            height: 100px;
            position: relative;
        }
        #petSvg {
            width: 100%;
            height: 100%;
        }
        #reactionBubble {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #reactionBubble.show {
            opacity: 1;
        }
    </style>
</head>

        function showReaction(text) {
            const bubble = document.getElementById('reactionBubble');
            bubble.textContent = text;
            bubble.classList.add('show');
            setTimeout(() => {
                bubble.classList.remove('show');
            }, 3000);
        }
